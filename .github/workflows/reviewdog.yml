name: reviewdog
on: [pull_request]

# Remove all default token permissions at the workflow level.
# Individual jobs grant only the permissions they need.
permissions: {}

jobs:
  golangci-lint:
    name: runner / golangci-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out code into the Go module directory
        # actions/checkout v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: golangci-lint
        # reviewdog/action-golangci-lint v2
        uses: reviewdog/action-golangci-lint@284129a3ac23bc5d8ac1522e0b6511df74a8836d # v2
        with:
          level: warning
          reporter: github-pr-review
