name: windows-$(Date:yyyyMMdd).$(Rev:r)

# Keep AppVeyor enabled until this pipeline is authorized and required on GitHub.
trigger:
  branches:
    include:
    - main
pr:
  autoCancel: true
  branches:
    include:
    - main

pool:
  name: RUST-PUBLIC-X64-WUS3
  demands:
  - imageOverride -equals RUST-W22-SQL25

variables:
  GOTOOLCHAIN: local

jobs:
- template: templates/windows-job.yml
  parameters:
    jobName: WindowsSqlAuth
    configuration:
      targetArch: amd64
      protocol: ''
      testTags: ''
      columnEncryption: ''
      integratedAuth: 'false'

- template: templates/windows-job.yml
  parameters:
    jobName: WindowsAlwaysEncrypted
    dependsOn:
    - WindowsSqlAuth
    configuration:
      targetArch: amd64
      protocol: ''
      testTags: ''
      columnEncryption: '1'
      integratedAuth: 'false'

- template: templates/windows-job.yml
  parameters:
    jobName: WindowsNamedPipes386
    dependsOn:
    - WindowsAlwaysEncrypted
    configuration:
      targetArch: '386'
      protocol: np
      testTags: np
      columnEncryption: ''
      integratedAuth: 'false'

- template: templates/windows-job.yml
  parameters:
    jobName: WindowsSharedMemorySspi
    dependsOn:
    - WindowsNamedPipes386
    configuration:
      targetArch: amd64
      protocol: lpc
      testTags: sm
      columnEncryption: ''
      integratedAuth: 'true'
